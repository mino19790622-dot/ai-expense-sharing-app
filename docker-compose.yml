services:
  api:
    build: .                       # 用当前目录的 Dockerfile 构建
    ports:
      - "8080:8000"                # 宿主机端口:容器端口。8000 已被 VIRG 容器占用，改用 8080 避开冲突
    volumes:
      - .:/app                     # 把当前目录挂进容器，改代码不用重建镜像（开发期）
    environment:
      ENV: dev                     # 环境变量，用映射写法最稳
